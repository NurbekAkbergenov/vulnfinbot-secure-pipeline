name: Security CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit semgrep pip-audit

      - name: Run unit tests
        run: pytest -v

      - name: Ensure reports directory exists
        run: mkdir -p reports

      - name: Run Bandit (SAST)
        run: bandit -r app/ -f json -o reports/bandit-report.json || true

      - name: Run Semgrep (SAST)
        run: semgrep scan --config security/semgrep/rules.yml --json --output reports/semgrep-report.json app/ || true

      - name: Run pip-audit (Dependency Scanning)
        run: pip-audit -f json -o reports/dependency-report.json || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t vulnfinbot:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'vulnfinbot:latest'
          format: 'json'
          output: 'reports/trivy-report.json'
        continue-on-error: true

      - name: Upload all security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnfinbot-security-reports
          path: reports/
          retention-days: 30
          if-no-files-found: warn
